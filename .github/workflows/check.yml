# プルリクエストでは公開せず、ルールと 50KB の配布物を検証する。
name: Check FreeCell

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test rules and build
        run: npm test
      - name: Build and verify size
        run: npm run build
