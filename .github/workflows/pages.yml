# テストと 50KB の容量検証を通った静的ファイルだけを GitHub Pages へ公開する。
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

# 実行中の公開を中断せず、同時に複数の公開処理を走らせない。
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          # 文書だけを更新した場合も、アプリの最終変更日を履歴から取得する。
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install build dependency from lockfile
        run: npm ci
      - name: Test rules and build
        run: npm test
      - name: Build and verify size
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static files
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
